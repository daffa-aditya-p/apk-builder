name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Application Name
        required: true
        default: MyApp
      app_id:
        description: Application ID
        required: true
        default: com.example.app
      version:
        description: Version
        required: true
        default: 1.0.0
  push:
    paths:
      - build-config.json
      - www/**
      - icon.png

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: |
          npm install -g cordova@latest
          cordova --version

      - name: Read build configuration
        id: config
        run: |
          python3 <<'PY'
          import json
          import os

          app_name = '${{ github.event.inputs.app_name }}' or 'MyApp'
          app_id = '${{ github.event.inputs.app_id }}' or 'com.example.app'
          version = '${{ github.event.inputs.version }}' or '1.0.0'
          version_code = '1'
          permissions = []
          orientation = 'portrait'
          fullscreen = 'false'
          statusbar = 'true'

          if os.path.exists('build-config.json'):
            with open('build-config.json', 'r', encoding='utf-8') as f:
              cfg = json.load(f)

            app_name = cfg.get('app_name', app_name)
            app_id = cfg.get('app_id', app_id)
            version = cfg.get('version', version)
            version_code = str(cfg.get('version_code', 1))
            permissions = cfg.get('permissions', []) or []
            display_options = cfg.get('display_options', {}) or {}
            orientation = display_options.get('orientation', orientation)
            fullscreen = str(display_options.get('fullscreen', False)).lower()
            statusbar = str(display_options.get('statusbar', True)).lower()

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write(f'app_name={app_name}\n')
            out.write(f'app_id={app_id}\n')
            out.write(f'version={version}\n')
            out.write(f'version_code={version_code}\n')
            out.write(f'orientation={orientation}\n')
            out.write(f'fullscreen={fullscreen}\n')
            out.write(f'statusbar={statusbar}\n')
            out.write(f"permissions_json={json.dumps(permissions)}\n")
          PY

      - name: Create Cordova project
        run: |
          cordova create apk-project "${{ steps.config.outputs.app_id }}" "${{ steps.config.outputs.app_name }}"
          cd apk-project
          cordova platform add android

      - name: Copy web files
        run: |
          if [ -d www ]; then
            rm -rf apk-project/www/*
            cp -r www/. apk-project/www/
          else
            echo "No www directory found; using default Cordova app."
          fi

      - name: Configure Cordova project
        run: |
          python3 <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          config_path = 'apk-project/config.xml'
          tree = ET.parse(config_path)
          root = tree.getroot()

          root.set('version', '${{ steps.config.outputs.version }}')
          root.set('{http://schemas.android.com/apk/res/android}versionCode', '${{ steps.config.outputs.version_code }}')

          for element in list(root):
            if element.tag == 'preference' and element.attrib.get('name') in {'orientation', 'Fullscreen'}:
              root.remove(element)

          ET.SubElement(root, 'preference', {'name': 'orientation', 'value': '${{ steps.config.outputs.orientation }}'})
          if '${{ steps.config.outputs.fullscreen }}' == 'true':
            ET.SubElement(root, 'preference', {'name': 'Fullscreen', 'value': 'true'})

          permissions = json.loads('${{ steps.config.outputs.permissions_json }}')
          existing_permissions = {
            child.attrib.get('{http://schemas.android.com/apk/res/android}name')
            for child in root
            if child.tag == 'uses-permission'
          }

          for permission in permissions:
            if permission not in existing_permissions:
              ET.SubElement(root, 'uses-permission', {
                '{http://schemas.android.com/apk/res/android}name': permission
              })

          tree.write(config_path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Copy icon (if exists)
        run: |
          if [ -f icon.png ]; then
            cp icon.png apk-project/resources/icon.png
          fi

      - name: Build APK
        run: |
          cd apk-project
          cordova build android --release -- --packageType=apk

      - name: Prepare APK artifact
        id: apk
        run: |
          APK_FILE=$(find apk-project/platforms/android/app/build/outputs -type f -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "APK build output not found"
            exit 1
          fi

          APP_NAME="${{ steps.config.outputs.app_name }}"
          VERSION="${{ steps.config.outputs.version }}"
          SAFE_NAME="${APP_NAME// /_}-${VERSION}-unsigned.apk"
          cp "$APK_FILE" "$SAFE_NAME"

          echo "apk_path=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.app_name }}-${{ steps.config.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create release on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
